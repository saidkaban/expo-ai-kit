plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.aikit'
version = '0.1.0'

// Every capability is opt-in at build time. The expo-ai-kit config plugin
// (app.plugin.js) writes one gradle property per enabled option at prebuild;
// bare React Native apps set the same keys in android/gradle.properties. Off
// (default): the dependency is not added and the source set is not compiled,
// zero bytes added to the APK.

// Opt-in text generation (ML Kit Prompt API + LiteRT-LM), from
// ["expo-ai-kit", { "llm": true }]. On: genai-prompt, litertlm-android
// (~21 MB uncompressed arm64 native library), and src/llm are compiled in.
def llmEnabled = (findProperty("expoAiKit.llm") ?: "false").toString().toBoolean()

// Opt-in Android embeddings (EmbeddingGemma via MediaPipe TextEmbedder).
// The expo-ai-kit config plugin (app.plugin.js) writes this gradle property at
// prebuild when the app enables ["expo-ai-kit", { "androidEmbeddings": true }].
// Off (default): the MediaPipe dependency is not added and src/embeddings is
// not compiled, zero bytes added to the APK. On: ~+25 MB APK (arm64).
def androidEmbeddingsEnabled = (findProperty("expoAiKit.androidEmbeddings") ?: "false").toString().toBoolean()

// Opt-in speech-to-text (ML Kit GenAI Speech Recognition). The config plugin
// writes this property at prebuild when the app enables
// ["expo-ai-kit", { "speech": true }]. Off (default): no speech dependency and
// src/speech is not compiled.
def speechEnabled = (findProperty("expoAiKit.speech") ?: "false").toString().toBoolean()

// Opt-in vision. The config plugin writes this property at prebuild:
// "true" for ["expo-ai-kit", { "vision": true }] (every feature), or a
// comma-separated subset for { "vision": ["face-detection", ...] } with the
// names background-removal, image-labeling, text-recognition, face-detection.
// Off (default): no ML Kit vision dependency and no vision source set is
// compiled. Each feature adds only its own ML Kit client (and bundled model,
// for labeling and faces) plus its source set; the segmentation and OCR models
// are Google Play services modules downloaded by prepareVision().
def visionProperty = (findProperty("expoAiKit.vision") ?: "false").toString().trim()
def visionAllFeatures = ["background-removal", "image-labeling", "text-recognition", "face-detection"]
def visionFeatures = visionProperty == "true" ? visionAllFeatures
  : visionProperty == "false" || visionProperty.isEmpty() ? []
  : visionProperty.split(",").collect { it.trim() }.findAll { !it.isEmpty() }
def unknownVisionFeatures = visionFeatures - visionAllFeatures
if (!unknownVisionFeatures.isEmpty()) {
  throw new GradleException("expo-ai-kit: unknown expoAiKit.vision feature(s) ${unknownVisionFeatures}; valid names are ${visionAllFeatures}")
}
def visionEnabled = !visionFeatures.isEmpty()
def visionSegmentation = visionFeatures.contains("background-removal")
def visionLabeling = visionFeatures.contains("image-labeling")
def visionText = visionFeatures.contains("text-recognition")
def visionFaces = visionFeatures.contains("face-detection")

android {
  namespace "expo.modules.aikit"
  defaultConfig {
    // ML Kit GenAI (Prompt API, speech recognition) requires API 26. Without
    // those options the library follows the app's minSdkVersion (Expo's floor
    // is 24; the face detector and LiteRT-LM run on 21 and 23).
    if (llmEnabled || speechEnabled) {
      minSdkVersion 26
    }
    versionCode 1
    versionName "0.1.0"
    // Keeps the reflection-instantiated embedding backend (and MediaPipe's
    // JNI-called classes) alive under R8 in release builds.
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main {
      if (llmEnabled) {
        java.srcDirs += 'src/llm/java'
      }
      if (androidEmbeddingsEnabled) {
        java.srcDirs += 'src/embeddings/java'
      }
      if (speechEnabled) {
        java.srcDirs += 'src/speech/java'
      }
      if (visionEnabled) {
        java.srcDirs += 'src/vision/java'
      }
      // Google Play services module install, shared by segmentation and OCR.
      if (visionSegmentation || visionText) {
        java.srcDirs += 'src/vision-play/java'
      }
      if (visionSegmentation) {
        java.srcDirs += 'src/vision-segmentation/java'
      }
      if (visionLabeling) {
        java.srcDirs += 'src/vision-labeling/java'
      }
      if (visionText) {
        java.srcDirs += 'src/vision-text/java'
      }
      if (visionFaces) {
        java.srcDirs += 'src/vision-face/java'
      }
    }
  }
}

// litertlm-android ships Kotlin metadata newer than the compiler Expo pins,
// which can only read one version ahead of itself. This flag tells the
// compiler to skip the metadata version check.
if (llmEnabled) {
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
      freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
  }
}

dependencies {
  if (llmEnabled) {
    implementation "com.google.mlkit:genai-prompt:1.0.0-beta2"
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
  }
  if (androidEmbeddingsEnabled) {
    // Keep in sync with tasksTextVersion in src/models.ts, it is part of the
    // embedding model identity, so bumping this must bump the JS pin too.
    implementation "com.google.mediapipe:tasks-text:1.0.0"
  }
  if (speechEnabled) {
    implementation "com.google.mlkit:genai-speech-recognition:1.0.0-alpha1"
  }
  if (visionEnabled) {
    // EXIF orientation for the legacy (API < 28) decode path.
    implementation "androidx.exifinterface:exifinterface:1.3.7"
  }
  if (visionFaces) {
    // Bundled face detector: works offline immediately.
    implementation "com.google.mlkit:face-detection:16.1.7"
  }
  if (visionLabeling) {
    // Image labeling ships its model with the app so it works offline at once.
    implementation "com.google.mlkit:image-labeling:17.0.9"
  }
  if (visionSegmentation) {
    // Subject segmentation is unbundled (Play services module).
    implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  }
  if (visionText) {
    // OCR is unbundled (one Play services module per script).
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1"
  }
  if (visionSegmentation || visionText) {
    // ModuleInstallClient, installs the Play services models in prepareVision().
    implementation "com.google.android.gms:play-services-base:18.10.0"
  }
}
