apply plugin: 'com.android.library'

group = 'expo.modules.aikit'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    // Simple helper that allows the root project to override versions declared by this library.
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 26)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

// Opt-in Android embeddings (EmbeddingGemma via MediaPipe TextEmbedder).
// The expo-ai-kit config plugin (app.plugin.js) writes this gradle property at
// prebuild when the app enables ["expo-ai-kit", { "androidEmbeddings": true }].
// Off (default): the MediaPipe dependency is not added and src/embeddings is
// not compiled, zero bytes added to the APK. On: ~+25 MB APK (arm64).
def androidEmbeddingsEnabled = (findProperty("expoAiKit.androidEmbeddings") ?: "false").toString().toBoolean()

// Opt-in speech-to-text (ML Kit GenAI Speech Recognition). The config plugin
// writes this property at prebuild when the app enables
// ["expo-ai-kit", { "speech": true }]. Off (default): no speech dependency and
// src/speech is not compiled.
def speechEnabled = (findProperty("expoAiKit.speech") ?: "false").toString().toBoolean()

// Opt-in vision (ML Kit Subject Segmentation, Image Labeling, Text Recognition
// v2). The config plugin writes this property at prebuild when the app enables
// ["expo-ai-kit", { "vision": true }]. Off (default): no ML Kit vision
// dependency and src/vision is not compiled. On: the ML Kit clients plus the
// bundled image-labeling model are added to the APK; the segmentation and OCR
// models are Google Play services modules downloaded by prepareVision().
def visionEnabled = (findProperty("expoAiKit.vision") ?: "false").toString().toBoolean()

android {
  namespace "expo.modules.aikit"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Keeps the reflection-instantiated embedding backend (and MediaPipe's
    // JNI-called classes) alive under R8 in release builds.
    consumerProguardFiles "consumer-rules.pro"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main {
      if (androidEmbeddingsEnabled) {
        java.srcDirs += 'src/embeddings/java'
      }
      if (speechEnabled) {
        java.srcDirs += 'src/speech/java'
      }
      if (visionEnabled) {
        java.srcDirs += 'src/vision/java'
      }
    }
  }
}

// litertlm-android 0.10.0 ships Kotlin 2.3.0 metadata. Expo SDK 55 pins
// the Kotlin compiler to 2.1.x which can only read up to 2.2.0 metadata.
// This flag tells the compiler to skip the metadata version check.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  kotlinOptions {
    freeCompilerArgs += ["-Xskip-metadata-version-check"]
  }
}

dependencies {
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta2"
  implementation "com.google.ai.edge.litertlm:litertlm-android:0.10.0"
  if (androidEmbeddingsEnabled) {
    // Keep in sync with tasksTextVersion in src/models.ts, it is part of the
    // embedding model identity, so bumping this must bump the JS pin too.
    implementation "com.google.mediapipe:tasks-text:1.0.0"
  }
  if (speechEnabled) {
    implementation "com.google.mlkit:genai-speech-recognition:1.0.0-alpha1"
  }
  if (visionEnabled) {
    // Subject segmentation and OCR are unbundled (Play services modules);
    // image labeling ships its model with the app so it works offline at once.
    implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
    implementation "com.google.mlkit:image-labeling:17.0.9"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.1"
    implementation "com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.1"
    // ModuleInstallClient, installs the Play services models in prepareVision().
    implementation "com.google.android.gms:play-services-base:18.10.0"
  }
}
