name: CI

# Fork-PR safe: uses the plain `pull_request` event (not `pull_request_target`)
# and no secrets, so a fork PR can never exfiltrate anything. GitHub also gates
# the first run of a new contributor's PR behind manual approval.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Newer pushes to the same PR/branch cancel older in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the workflow itself unfiltered so required checks are reported even
  # when a job is skipped. Top-level path filters can leave required checks
  # pending forever on docs-only PRs.
  changes:
    name: detect changed areas
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.scope.outputs.library }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          # Run everything when GitHub does not provide a usable comparison
          # commit, such as the first push of a new branch.
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || \
            ! git cat-file -e "${base_sha}^{commit}"; then
            echo "library=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          library=false
          docs=false

          while IFS= read -r -d '' file; do
            case "$file" in
              .github/workflows/ci.yml)
                # Validate both paths when their orchestration changes.
                library=true
                docs=true
                ;;
              docs/*)
                docs=true
                ;;
              *)
                library=true
                ;;
            esac
          done < <(git diff --name-only -z "$base_sha" "$GITHUB_SHA")

          echo "library=$library" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # Tier 1 — cheap. Catches TS/JS regressions when library files change.
  node:
    name: build + lint + test (node)
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  docs:
    name: build + lint + links (docs)
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check

  # Tier 2 — Android native. Kotlin/Gradle build on Linux (no macOS needed).
  # Guards the Kotlin surface the node tier can't see, by regenerating the
  # example's android/ via `expo prebuild` and compiling it.
  android:
    name: compile android (kotlin)
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Build the library first so the example's `file:..` dep resolves.
      - run: npm ci
      - run: npm run build
      - name: Install example deps
        working-directory: example
        run: npm ci
      - name: Prebuild android
        working-directory: example
        run: npx expo prebuild --platform android --no-install
      - name: Compile Kotlin (app + autolinked expo-ai-kit module)
        working-directory: example/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

  # Tier 3 — iOS native. THE tier that catches Swift errors like PR #8's.
  # Free on public repos as long as it's the standard `macos-*` runner (not
  # `-large`/`-xlarge`). Builds against the SIMULATOR SDK so no code signing.
  ios:
    name: build ios (swift, simulator)
    needs: changes
    if: ${{ needs.changes.outputs.library == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install example deps
        working-directory: example
        run: npm ci
      # Runs `pod install`, which triggers the podspec's prepare_command
      # (scripts/install-litertlm.sh) to fetch the LiteRT-LM C xcframework.
      - name: Prebuild ios
        working-directory: example
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: example/ios
        run: pod install
      - name: Build (simulator, no signing)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace example.xcworkspace \
            -scheme example \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
